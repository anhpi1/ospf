<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSPF Architecture — Drill-down Flow</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

  .node-card {
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ── Badges ────────────────────────────────────── */
  .badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 6px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .badge-leaf   { background: #f3f4f6; color: #6b7280; border: 1px solid #d1d5db; }
  .badge-loop   { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .badge-branch { background: #e0e7ff; color: #3730a3; border: 1px solid #a5b4fc; }

  /* ── Node types ────────────────────────────────── */
  .node-leaf    { background: #fff;    border: 1px solid #e5e7eb; }
  .node-loop    { background: #fffbeb; border: 1px solid #fcd34d; cursor: pointer; }
  .node-loop:hover { background: #fef3c7; }
  .node-branch  { background: #eef2ff; border: 2px solid #a5b4fc; cursor: pointer; }
  .node-branch:hover { background: #e0e7ff; }

  /* ── Selected ──────────────────────────────────── */
  .node-selected {
    box-shadow: 0 0 0 3px rgba(79,70,229,0.3);
    border-color: #4f46e5 !important;
  }

  /* ── Active drill target ───────────────────────── */
  .node-drilled {
    box-shadow: 0 0 0 3px rgba(245,158,11,0.35);
    border-color: #f59e0b !important;
    border-width: 2px !important;
  }

  /* ── Connector ─────────────────────────────────── */
  .connector {
    display: flex;
    justify-content: center;
    color: #9ca3af;
    font-size: 18px;
    padding: 2px 0;
  }

  /* ── Content ───────────────────────────────────── */
  .code-block {
    background: #1e293b;
    color: #e2e8f0;
    border-radius: 8px;
    padding: 14px;
    overflow-x: auto;
    font-size: 13px;
    font-family: monospace;
  }
  .code-lang {
    display: inline-block;
    font-size: 11px;
    color: #94a3b8;
    background: #334155;
    padding: 1px 8px;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .rfc-block {
    background: #fefce8;
    border-left: 4px solid #eab308;
    padding: 10px 14px;
    margin: 12px 0;
    font-size: 13px;
    font-style: italic;
    color: #854d0e;
  }

  /* ── Panels ────────────────────────────────────── */
  .panel {
    overflow-y: auto;
    padding: 20px 18px;
    border-right: 1px solid #e5e7eb;
    flex: 1 1 33.333%;
    min-width: 0;
  }

  /* ── Breadcrumb ────────────────────────────────── */
  .bc-link         { color: #4f46e5; cursor: pointer; }
  .bc-link:hover   { color: #3730a3; text-decoration: underline; }
  .bc-arrow        { color: #9ca3af; margin: 0 8px; }
  .bc-last         { color: #1f2937; font-weight: 600; }

  /* ── Misc ──────────────────────────────────────── */
  pre.flow-ascii   { font-family: monospace; font-size: 13px; color: #374151; background: #f9fafb; border-radius: 8px; padding: 14px; overflow-x: auto; white-space: pre; }
  table            { width: 100%; font-size: 13px; border-collapse: collapse; }
  table th         { background: #f3f4f6; text-align: left; padding: 8px 12px; border: 1px solid #d1d5db; font-weight: 600; }
  table td         { padding: 8px 12px; border: 1px solid #d1d5db; }
  ul.content-list  { list-style: disc; padding-left: 24px; font-size: 13px; color: #374151; }
  ul.content-list li { margin-bottom: 4px; }
  .section-title   { font-size: 14px; font-weight: 700; color: #111827; margin-bottom: 8px; }
  .block-label     { font-size: 12px; font-weight: 500; color: #4f46e5; margin-bottom: 12px; }
  .content-label   { font-size: 12px; font-weight: 600; color: #374151; margin-top: 4px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #e5e7eb; }
  .meta-tag        { font-size: 11px; color: #6b7280; font-weight: 400; margin-left: auto; }
  .node-label      { font-size: 14px; font-weight: 500; color: #1f2937; flex: 1; }
  .panel-title     { font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .legend-row      { display: flex; gap: 16px; align-items: center; font-size: 11px; color: #6b7280; margin-bottom: 8px; flex-wrap: wrap; }
  .legend-item     { display: flex; align-items: center; gap: 4px; }
  .clickable       { cursor: pointer; }
  .clickable:hover { opacity: 0.85; }
</style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">

<nav id="breadcrumb" class="bg-white border-b border-gray-200 px-6 py-3 text-sm flex-shrink-0"></nav>
<main id="panels" class="flex flex-1 overflow-hidden"></main>

<script src="vi-flow-data.js"></script>
<script>
const D = FLOW_DATA;

const state = {
  path: [],           // [{id, label, sectionId?, subFlowId?}]
  selectedId: null,   // node ID whose content is shown in right panel
  selectedSection: null,  // sectionId for selected node
  selectedSubFlow: null,  // subFlowId for selected node
};

const TYPE_LABEL = { leaf: 'leaf', loop: 'loop', branch: 'branch' };

// ── Data helpers ───────────────────────────────────────
function sec(id)    { return D.sections[id]; }
function sub(sId,sfId){ const s=sec(sId); return s&&s.subFlows? s.subFlows[sfId]:null; }
function flowNodes(sId, sfId) {
  if(sfId){ const f=sub(sId,sfId); return f?f.flow:[]; }
  const s=sec(sId); return s?s.flow:[];
}
function getContent(sId, sfId, nId) {
  // Main flow node → section overview
  if(!sId && D.sections[nId] && D.sections[nId].overview) return D.sections[nId].overview;
  // Section or subFlow node
  const s=sec(sId); if(!s) {
    // Maybe it's a block node in section flow with overview
    for(const [ssid,ss] of Object.entries(D.sections)) {
      if(ss.nodes && ss.nodes[nId]) return ss.nodes[nId].content||[];
    }
    return [];
  }
  if(sfId){ const f=sub(sId,sfId); return f&&f.nodes&&f.nodes[nId]?f.nodes[nId].content||[]:[]; }
  return s.nodes&&s.nodes[nId]?s.nodes[nId].content||[]:[];
}

// ── Find where a node lives ────────────────────────────
function locateNode(nId) {
  // Main flow?
  if(D.mainFlow.some(n=>n.id===nId)) return {inMain:true};
  // Sections
  for(const [sId,s] of Object.entries(D.sections)) {
    if(s.flow&&s.flow.some(n=>n.id===nId)) return {sectionId:sId};
    for(const [sfId,sf] of Object.entries(s.subFlows||{})) {
      if(sf.flow&&sf.flow.some(n=>n.id===nId)) return {sectionId:sId, subFlowId:sfId};
    }
  }
  return {};
}
function hasChildren(nId, loc) {
  if(loc.inMain) return !!D.sections[nId];
  if(loc.sectionId) return !!sub(loc.sectionId, nId);
  return false;
}

// ── DOM helpers ────────────────────────────────────────
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v]) => {
    if(k==='class') e.className=v;
    else if(k==='onclick') e.addEventListener('click',v);
    else if(k==='html') e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  children.forEach(c => { if(typeof c==='string') e.appendChild(document.createTextNode(c)); else if(c) e.appendChild(c); });
  return e;
}

// ── Breadcrumb ─────────────────────────────────────────
function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';
  const home = el('span', {class:'bc-link', onclick:()=>{state.path=[];state.selectedId=null;state.selectedSection=null;state.selectedSubFlow=null;render();}}, D.doc.title.split('—')[0].trim());
  bc.appendChild(home);
  state.path.forEach((p,i) => {
    bc.appendChild(el('span', {class:'bc-arrow'}, '▸'));
    if(i===state.path.length-1) {
      bc.appendChild(el('span', {class:'bc-last'}, p.label));
    } else {
      bc.appendChild(el('span', {class:'bc-link', onclick:(()=>{const n=i+1;return()=>{state.path=state.path.slice(0,n);state.selectedId=null;state.selectedSection=null;state.selectedSubFlow=null;render();}})()}, p.label));
    }
  });
}

// ── Legend ─────────────────────────────────────────────
function renderLegend() {
  const bar = el('div', {class:'legend-row'});
  bar.appendChild(el('span', {}, 'Chú giải:'));
  for(const t of ['leaf','loop','branch']) {
    bar.appendChild(el('div', {class:'legend-item'}, el('span', {class:'badge badge-'+t}, TYPE_LABEL[t])));
  }
  return bar;
}

// ── Node card ──────────────────────────────────────────
function renderNodeCard(node, depth, drillActiveId) {
  const nType = node.nodeType || 'leaf';
  const loc = locateNode(node.id);
  const expandable = hasChildren(node.id, loc);

  let cls = 'node-card node-' + nType;

  // Selected by user (content shown in right panel)?
  if(node.id === state.selectedId) cls += ' node-selected';

  // In drill path? (parent was clicked to expand)
  const isDrillAncestor = state.path.some(p => p.id === node.id);
  if(isDrillAncestor && node.id === drillActiveId) cls += ' node-drilled';

  // Clickable?
  const isClickable = expandable || (!expandable && nType !== 'branch');
  // leaf/loop are clickable to select, branch is clickable to drill
  if(isClickable) cls += ' clickable';

  const card = el('div', {class: cls});
  card.appendChild(el('span', {class:'badge badge-'+nType}, TYPE_LABEL[nType]));
  card.appendChild(el('span', {class:'node-label'}, node.label));
  if(node.meta) card.appendChild(el('span', {class:'meta-tag'}, node.meta));

  if(isClickable) {
    card.addEventListener('click', () => {
      if(expandable) {
        // Drill down
        const entry = { id: node.id, label: node.label };
        if(depth===0) {
          entry.sectionId = node.id;
        } else {
          const parent = state.path[depth-1];
          entry.sectionId = parent.sectionId;
          if(sub(parent.sectionId, node.id)) entry.subFlowId = node.id;
        }
        state.path = [...state.path.slice(0, depth), entry];
      }
      // Select this node to show content
      state.selectedId = node.id;
      state.selectedSection = loc.sectionId || null;
      state.selectedSubFlow = loc.subFlowId || null;
      render();
    });
  }

  return card;
}

function renderFlow(nodes, depth, drillActiveId) {
  const wrap = el('div', {class:'flex flex-col'});
  nodes.forEach((n, i) => {
    wrap.appendChild(renderNodeCard(n, depth, drillActiveId));
    if(i < nodes.length-1) wrap.appendChild(el('div', {class:'connector'}, '↓'));
  });
  return wrap;
}

// ── Content blocks ─────────────────────────────────────
function renderContentBlock(b) {
  switch(b.type) {
    case 'p':  return el('div', {class:'text-sm text-gray-700 mb-3', html:b.value});
    case 'code':
      const cw = el('div', {class:'code-block mb-3'});
      if(b.lang) cw.appendChild(el('span', {class:'code-lang'}, b.lang));
      cw.appendChild(el('pre', {class:'whitespace-pre-wrap'}, b.value));
      return cw;
    case 'pre': return el('pre', {class:'flow-ascii mb-3'}, b.value);
    case 'table':
      const t = el('table', {class:'mb-3'});
      const thr = el('tr'); b.headers.forEach(h => thr.appendChild(el('th',{},h)));
      t.appendChild(el('thead',{},thr));
      const tb = el('tbody');
      b.rows.forEach(r => { const tr=el('tr'); r.forEach(c=>tr.appendChild(el('td',{},c))); tb.appendChild(tr); });
      t.appendChild(tb); return t;
    case 'ul':
      const ul = el('ul', {class:'content-list mb-3'});
      b.items.forEach(i => ul.appendChild(el('li', {html:i})));
      return ul;
    case 'rfc': return el('div', {class:'rfc-block'}, '📖 '+b.value);
    default: return null;
  }
}

// ── Right panel: explanation for selected node ─────────
function renderExplanationPanel() {
  const wrapper = el('div', {class:'panel'});
  wrapper.appendChild(el('div', {class:'panel-title'}, 'Giải thích'));

  if(!state.selectedId) {
    // Nothing selected: show appendix
    wrapper.appendChild(el('p', {class:'text-xs text-gray-400 mt-1 mb-4'}, 'Click vào một node để xem giải thích chi tiết.'));
    if(D.appendix) {
      if(D.appendix.directory) {
        const ds = el('div', {class:'mt-4'});
        ds.appendChild(el('h3', {class:'text-sm font-semibold text-gray-700 mb-2'}, D.appendix.directory.title));
        ds.appendChild(el('pre', {class:'flow-ascii text-xs'}, D.appendix.directory.tree));
        wrapper.appendChild(ds);
      }
      if(D.appendix.rfcTable) {
        const rs = el('div', {class:'mt-4'});
        rs.appendChild(el('h3', {class:'text-sm font-semibold text-gray-700 mb-2'}, D.appendix.rfcTable.title));
        const rt = el('table', {});
        D.appendix.rfcTable.rows.forEach(r => {
          const tr = el('tr');
          tr.appendChild(el('td', {class:'px-2 py-1 border border-gray-200 text-xs'}, r[0]));
          tr.appendChild(el('td', {class:'px-2 py-1 border border-gray-200 text-xs font-mono text-indigo-700 whitespace-nowrap'}, r[1]));
          rt.appendChild(tr);
        });
        rs.appendChild(rt); wrapper.appendChild(rs);
      }
    }
    return wrapper;
  }

  // Show content for selected node
  const nId = state.selectedId;
  const sId = state.selectedSection;
  const sfId = state.selectedSubFlow;

  // Find the node's label and type
  let nLabel = nId;
  let nType = 'leaf';
  const loc = locateNode(nId);
  if(loc.inMain) {
    const n = D.mainFlow.find(x=>x.id===nId);
    if(n) { nLabel = n.label; nType = n.nodeType||'leaf'; }
  } else if(loc.sectionId) {
    const s = sec(loc.sectionId);
    if(s && s.flow) { const n = s.flow.find(x=>x.id===nId); if(n) { nLabel=n.label; nType=n.nodeType||'leaf'; } }
    if(loc.subFlowId && sub(loc.sectionId, loc.subFlowId)) {
      const sf = sub(loc.sectionId, loc.subFlowId);
      if(sf.flow) { const n = sf.flow.find(x=>x.id===nId); if(n) { nLabel=n.label; nType=n.nodeType||'leaf'; } }
    }
  }

  // Title
  wrapper.appendChild(el('div', {class:'section-title'}, nLabel));
  wrapper.appendChild(el('div', {style:'margin-bottom:8px'}, el('span', {class:'badge badge-'+nType}, TYPE_LABEL[nType])));

  // Content
  const content = getContent(sId, sfId, nId);
  if(content.length===0) {
    wrapper.appendChild(el('p', {class:'text-xs text-gray-400 mt-2'}, '(Không có nội dung giải thích)'));
  } else {
    content.forEach(b => wrapper.appendChild(renderContentBlock(b)));
  }

  return wrapper;
}

// ── Main render ────────────────────────────────────────
function render() {
  renderBreadcrumb();
  const panels = document.getElementById('panels');
  panels.innerHTML = '';
  const d = state.path.length;

  // ── Depth 0: Main flow | Overview | Explanation ──
  if(d===0) {
    // Left: Main Flow
    const left = el('div', {class:'panel'});
    left.appendChild(el('div', {class:'panel-title'}, 'Dòng chảy chính'));
    left.appendChild(el('h1', {class:'text-lg font-bold text-gray-900 mb-1'}, D.doc.title));
    left.appendChild(el('p', {class:'text-xs text-gray-500 mb-2'}, D.doc.desc));
    left.appendChild(renderLegend());
    left.appendChild(el('div', {style:'height:8px'}));
    left.appendChild(renderFlow(D.mainFlow, 0, null));
    panels.appendChild(left);

    // Middle: Overview
    const mid = el('div', {class:'panel'});
    mid.appendChild(el('div', {class:'panel-title'}, 'Tổng quan'));
    mid.appendChild(el('p', {class:'text-sm text-gray-600 mt-1 leading-relaxed'},
      'Giải thích cách OSPFv2 hoạt động từ khám phá hàng xóm, đồng bộ cơ sở dữ liệu, '+
      'lan truyền trạng thái liên kết, đến tính toán đường đi và chuyển tiếp dữ liệu. '+
      'Nguồn: RFC 2328 — single Area 0, P2P-only, không DR/BDR.'
    ));
    mid.appendChild(el('p', {class:'text-sm text-gray-600 mt-3 leading-relaxed'},
      'Dòng chảy chính: 6 khối. Click vào node '),
      el('span', {class:'badge badge-branch', style:'display:inline-block;vertical-align:middle'}, 'branch'),
      el('span', {class:'text-sm text-gray-600'}, ' để drill-down vào sub-flow. Click node '),
      el('span', {class:'badge badge-leaf', style:'display:inline-block;vertical-align:middle'}, 'leaf'),
      el('span', {class:'text-sm text-gray-600'}, '/'),
      el('span', {class:'badge badge-loop', style:'display:inline-block;vertical-align:middle'}, 'loop'),
      el('span', {class:'text-sm text-gray-600'}, ' để xem giải thích ở cột phải.'));
    panels.appendChild(mid);

    // Right: Explanation
    panels.appendChild(renderExplanationPanel());
    return;
  }

  // ── Depth 1: Main flow | Section flow | Explanation ──
  if(d===1) {
    // Left: Main flow
    const left = el('div', {class:'panel'});
    left.appendChild(el('div', {class:'panel-title'}, 'Dòng chảy chính'));
    left.appendChild(renderLegend());
    left.appendChild(el('div', {style:'height:8px'}));
    left.appendChild(renderFlow(D.mainFlow, 0, state.path[0].id));
    panels.appendChild(left);

    // Middle: Section flow
    const secData = sec(state.path[0].sectionId);
    const mid = el('div', {class:'panel'});
    mid.appendChild(el('div', {class:'panel-title'}, state.path[0].label));
    mid.appendChild(renderLegend());
    mid.appendChild(el('div', {style:'height:8px'}));
    mid.appendChild(renderFlow(secData?secData.flow:[], 1, state.path[0].id));
    panels.appendChild(mid);

    // Right: Explanation
    panels.appendChild(renderExplanationPanel());
    return;
  }

  // ── Depth 2+: grandparent | parent | Explanation ──
  const grand = state.path[d-2];
  const left = el('div', {class:'panel'});
  let gTitle, gNodes, gDepth, gActive;
  if(d===2) {
    // Left panel: show level 1's flow (trượt từ giữa sang trái)
    const lv1 = state.path[0];
    gTitle = lv1.label;
    gNodes = flowNodes(lv1.sectionId);
    gDepth = 1;
    gActive = lv1.id;
  } else {
    const gg = state.path[d-3];
    if(grand.subFlowId) {
      gTitle = gg?gg.label:'Dòng chảy chính';
      gNodes = flowNodes(grand.sectionId, grand.subFlowId);
      gDepth = d-1;
      gActive = grand.id;
    } else if(grand.sectionId) {
      gTitle = grand.label;
      gNodes = flowNodes(grand.sectionId);
      gDepth = d-1;
      gActive = grand.id;
    } else {
      gTitle = 'Dòng chảy chính';
      gNodes = D.mainFlow;
      gDepth = 0;
      gActive = grand.id;
    }
  }
  left.appendChild(el('div', {class:'panel-title'}, gTitle));
  left.appendChild(renderLegend());
  left.appendChild(el('div', {style:'height:8px'}));
  left.appendChild(renderFlow(gNodes, gDepth, gActive));
  panels.appendChild(left);

  // Middle: parent
  const par = state.path[d-1];
  const mid = el('div', {class:'panel'});
  let mNodes;
  if(par.sectionId && par.subFlowId) {
    mNodes = flowNodes(par.sectionId, par.subFlowId);
  } else if(par.sectionId) {
    mNodes = flowNodes(par.sectionId);
  } else {
    mNodes = D.mainFlow;
  }
  mid.appendChild(el('div', {class:'panel-title'}, par.label));
  mid.appendChild(renderLegend());
  mid.appendChild(el('div', {style:'height:8px'}));
  mid.appendChild(renderFlow(mNodes, d, par.id));
  panels.appendChild(mid);

  panels.appendChild(renderExplanationPanel());
}

render();
</script>
</body>
</html>
